name: Publish sentinel0

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.0.4). Leave blank to publish the current one.'
        required: false
      dry_run:
        description: Pack and inspect without publishing
        type: boolean
        default: false

  release:
    types: [published]

permissions:
  id-token: write   # npm trusted publishing
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm

    env:
      NODE_OPTIONS: --experimental-sqlite
      SENTINEL0_DB_PATH: memory

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Publish from the newest supported runtime; the package itself works
          # from 22.5 up, which CI proves separately.
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Set the version
        if: inputs.version != ''
        run: |
          pnpm version:set "${{ inputs.version }}"
          # The internal @sentinel0/* packages are unpublished and linked by
          # version, so they move in lockstep or the published CLI cannot
          # resolve them. set-version.mjs is what keeps them aligned.
          git --no-pager diff --stat

      # Publishing something that does not build or pass its tests is the one
      # mistake that reaches users directly.
      - name: Lint
        run: pnpm lint

      # Build first, as ci.yml does. Two suites only mean something against
      # build output — `common`'s circular-import guard imports the compiled
      # package, and the CLI's bundled-manifest test used to read `dist/` —
      # and both go quiet or fail when the build has not run yet. Testing
      # first made the 0.0.4 publish fail after lint had already passed.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check the published entry point is executable
        run: |
          test -x packages/cli/dist/cli/src/index.js \
            || { echo "::error::dist/cli/src/index.js is not executable; the global"\
                      "command would fail with 'permission denied'."; exit 1; }
          node packages/cli/dist/cli/src/index.js --version

      - name: Pack and inspect
        run: |
          cd packages/cli
          pnpm pack:tarball
          echo "::group::Tarball contents"
          tar -tzf sentinel0-*.tgz | head -40
          echo "::endgroup::"
          # The internal packages are bundled, not fetched from npm, so their
          # absence would only surface on a user's machine at install time.
          for pkg in common orchestrator; do
            tar -tzf sentinel0-*.tgz | grep -q "node_modules/@sentinel0/$pkg/" \
              || { echo "::error::@sentinel0/$pkg is missing from the tarball."; exit 1; }
          done

      # The check that would have caught parallax-cli 0.2.0. Everything above
      # passes on a tarball whose bundled packages cannot resolve their own
      # dependencies, because `--version` never reaches the orchestrator's entry
      # point, so the import that fails is never evaluated.
      #
      # This installs the tarball the way a user does — a directory with no
      # workspace, no pnpm store and no hoisting — and checks that every package
      # the bundled code imports is actually present. Package presence rather
      # than module resolution, because resolving on another package's behalf
      # needs a resolver rooted at that package, and importing the modules to
      # find out would execute them.
      - name: Verify a clean install has everything the bundle imports
        run: |
          set -euo pipefail
          TARBALL="$(ls "$PWD"/packages/cli/sentinel0-*.tgz)"
          WORK="$(mktemp -d)"
          cp .github/scripts/verify-bundled-imports.mjs "$WORK/"
          cd "$WORK"
          npm init -y >/dev/null
          npm install "$TARBALL" >/dev/null
          node verify-bundled-imports.mjs

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          npm install -g npm@latest
          pnpm --dir packages/cli publish:package

      - name: Skipped
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: packed and verified, nothing published."
